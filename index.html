<!DOCTYPE html>
<!-- Tells the browser this is an HTML5 document -->
<html lang="en">

<head>
    <!-- Character encoding (supports all languages) -->
    <meta charset="UTF-8">

    <!-- Makes the page responsive on mobile devices -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <!-- Title shown on browser tab -->
    <title>Document</title>

    <!-- Your own CSS file -->
    <link rel="stylesheet" href="style.css">

    <!-- Bootstrap CSS (for design & layout) -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css">
</head>

<body>
    
    <!-- Background image (full screen, fixed position) -->
    <img src="img1.jpg"
        class="position-fixed top-0 start-0 w-100 vh-100 object-fit-cover z-n1">

    <!-- Main container (center everything vertically & horizontally) -->
    <div class="d-flex flex-column justify-content-center align-items-center vh-100 container-fluid">

        <!-- Title -->
        <div>
            <h1 id="text" class="badge text-bg-dark text-wraps fs-1 fw-bold mb-3">
                COUNTRY INFO FINDER
            </h1>
        </div>
        <div id="gif1">
            <img src="https://i.gifer.com/W31X.gif" width="200" alt="" srcset="">
        </div>

        <!-- Input box to enter country name -->
        <div>
            <input 
                id="countryname" 
                class="focus-ring m-2" 
                type="text" 
                placeholder="Enter Your Country ">
        </div>

        <!-- Button to search country info -->
        <div>
            <!-- onclick calls getAction() function from app.js -->
            <input 
                id="button" 
                type="button" 
                class="btn btn-dark mb-2" 
                value="Find" 
                onclick="getAction()">
        </div>

        <!-- Flag image will be added here using JavaScript -->
        <div id="imgflag" class="mb-3 mt-5"></div>

        <!-- Table for country details (filled using JavaScript) -->
        <table 
            id="table"
            class="table-bordered mx-auto text-light fw-bold fs-5 mb-2 text-center bg-dark bg-opacity-50 ">
        </table>

        <!-- Map image will be shown here -->
        <div id="mapimg" class="mb-1"></div>
    </div>

    <!-- Your JavaScript file -->
    <script src="app.js"></script>

    <!-- Bootstrap JavaScript -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>

</body>
</html>
